name: Windows exe

on:
  push:
  pull_request:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test and publish FolderScope.exe
        run: bash build/publish-win-x64.sh artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: FolderScope-win-x64
          path: artifacts/win-x64/FolderScope.exe
          if-no-files-found: error
